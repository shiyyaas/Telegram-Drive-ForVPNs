[package]
name = "app"
version = "1.1.8"
description = "Headless Web and API Server"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }

chrono = "0.4"
base64 = "0.21"
log = "0.4"
env_logger = "0.11"
actix-web = "4"
actix-cors = "0.7"
futures = "0.3"
async-stream = "0.3"
actix-rt = "2"
